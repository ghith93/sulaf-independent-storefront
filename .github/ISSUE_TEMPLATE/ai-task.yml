name: AI implementation task
description: Request a bounded code change from the repository's AI agent
title: "[AI task] "
labels: ["ai-task"]
body:
  - type: markdown
    attributes:
      value: |
        The agent can modify only index.html, styles.css, and app.js. It opens a pull request and never merges or deploys automatically. Do not include API keys, passwords, customer data, or other secrets.
  - type: textarea
    id: goal
    attributes:
      label: Desired outcome
      description: Describe the result you want, not implementation details.
      placeholder: Improve mobile navigation and keyboard accessibility...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be true when the task is complete?
      placeholder: |
        - Works on small phone screens
        - Keyboard focus is visible
        - Existing chat and provider routing still work
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional constraints or relevant file names. Do not paste secrets.
    validations:
      required: false
