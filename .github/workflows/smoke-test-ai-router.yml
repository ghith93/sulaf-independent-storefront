name: AI Router live smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-test-ai-router.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ai-router-smoke-test
  cancel-in-progress: false

jobs:
  live-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "https://sulaf-ai-router.ghith-shikhkhaled.workers.dev/health" \
            -o health.json
          jq '{ok, service, providers}' health.json
          jq -e '.ok == true and (.providers | any(. == true))' health.json >/dev/null

      - name: Test each configured provider without exposing secrets
        env:
          API_URL: https://sulaf-ai-router.ghith-shikhkhaled.workers.dev/chat
        run: |
          set -uo pipefail
          providers=("OpenRouter" "Gemini" "Cloudflare Workers AI" "Cohere")
          passed=0
          failed=0
          for provider in "${providers[@]}"; do
            echo "::group::Provider check: $provider"
            payload="$(jq -nc --arg provider "$provider" '{provider:$provider,messages:[{role:"user",content:"Reply with exactly: SULAF_OK"}]}')"
            status="$(curl --silent --show-error --max-time 25 \
              -H "Origin: https://ghith93.github.io" \
              -H "Content-Type: application/json" \
              -o response.json -w "%{http_code}" \
              -X POST "$API_URL" --data "$payload" 2>/dev/null)" || status="000"
            if [[ "$status" == "200" ]] && jq -e '.ok == true and (.content | type == "string" and length > 0)' response.json >/dev/null 2>&1; then
              echo "PASS: $provider returned a non-empty response (HTTP 200)."
              passed=$((passed + 1))
            else
              reason="$(jq -r '.providers // .error // "request_failed"' response.json 2>/dev/null | head -c 300 || true)"
              echo "::warning::FAIL: $provider (HTTP $status). Detail: $reason"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Provider summary: $passed passed; $failed failed."
          echo "Individual failures are reported as warnings so one unavailable free provider does not hide healthy providers."
          test "$passed" -ge 1 || { echo "::error::All provider generation checks failed."; exit 1; }

      - name: Verify automatic routing returns a real answer
        env:
          API_URL: https://sulaf-ai-router.ghith-shikhkhaled.workers.dev/chat
        run: |
          set -euo pipefail
          payload='{"provider":"auto","messages":[{"role":"user","content":"Reply with exactly: SULAF_OK"}]}'
          status="$(curl --silent --show-error --max-time 75 \
            -H "Origin: https://ghith93.github.io" \
            -H "Content-Type: application/json" \
            -o response.json -w "%{http_code}" \
            -X POST "$API_URL" --data "$payload" || true)"
          echo "HTTP status: $status"
          jq '{ok, provider, fallback_used, error}' response.json
          test "$status" = "200"
          jq -e '.ok == true and (.content | type == "string" and length > 0) and (.provider | type == "string" and length > 0)' response.json >/dev/null
          echo "PASS: automatic routing returned content."
