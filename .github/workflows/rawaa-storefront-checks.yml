name: RAWAA storefront checks

on:
  push:
    branches: [feat/rawaa-independent-storefront]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate storefront metadata and critical purchase path
        run: node scripts/check-storefront.mjs
