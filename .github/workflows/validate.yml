name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Require site files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f README.md
          test -f worker.js
          test -f worker.test.js
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Run Worker regression tests
        run: node --test worker.test.js
      - name: Validate Worker syntax
        run: node --check worker.js
      - name: Check for conflict markers
        run: |
          if grep -R -n -E '^(<<<<<<< |=======|>>>>>>> )' --include='*.html' --include='*.css' --include='*.js' .; then
            echo 'Merge conflict markers found.'
            exit 1
          fi
